worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 256;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# no access log: paste URLs must not end up in web server logs
	access_log off;
	sendfile on;
	server_tokens off;

	client_max_body_size 16m;
	client_body_temp_path /tmp/nginx-client;
	proxy_temp_path /tmp/nginx-proxy;
	fastcgi_temp_path /tmp/nginx-fastcgi;
	uwsgi_temp_path /tmp/nginx-uwsgi;
	scgi_temp_path /tmp/nginx-scgi;

	server {
		listen 127.0.0.1:8000;
		root /srv/privatebin;
		index index.php;

		location = /favicon.ico {
			try_files /img/favicon.ico =404;
		}

		location / {
			try_files $uri $uri/ /index.php?$query_string;
		}

		location = /index.php {
			fastcgi_pass 127.0.0.1:9000;
			fastcgi_param SCRIPT_FILENAME $document_root/index.php;
			include /etc/nginx/fastcgi_params;
		}

		# only index.php is reachable, every other PHP file is denied
		location ~ \.php$ {
			return 404;
		}

		location ~ /\. {
			deny all;
		}

		# server-side directories are never served
		location ~ ^/(bin|cfg|data|doc|i18n|lib|tpl|tst|vendor)(/|$) {
			deny all;
		}
	}
}
