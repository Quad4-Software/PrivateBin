name: Draft Release

on:
  push:
    tags: '[0-9]+.[0-9]?[0-9]?[0-9]?.?[0-9]+'

permissions: {}

# tag pushes are unique, do not cancel a release in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    permissions:
      contents: write # needed to create the draft release
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Fetch changelog from tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Extract latest changelog entry and attach it to draft
        uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1
        with:
          changelog: CHANGELOG.md
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Collect release artifacts
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Collect artifacts
        run: |
          wget -q "https://github.com/Quad4-Software/VoidBin/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          wget -q "https://github.com/Quad4-Software/VoidBin/archive/refs/tags/${GITHUB_REF_NAME}.zip"

      - name: Generate hashes
        shell: bash
        id: hash
        run: echo "hashes=$(sha256sum ${GITHUB_REF_NAME}.* | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs:
      - release
    name: SLSA provenance
    permissions:
      actions: read # needed to read workflow metadata for the attestation
      id-token: write # needed to mint the OIDC token for signing
      contents: write # needed to attach provenance to the draft release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      draft-release: true
      upload-assets: true
