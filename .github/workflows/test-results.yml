name: Test Results

on:
  # the job-level condition limits this to runs from this repository, so
  # artifacts produced by fork pull request code are never processed here
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

permissions: {}

# one publish per triggering Tests run, never cancel mid-publish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  test-results:
    name: Test Results
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    permissions:
      checks: write # needed to publish check runs with the test results
      pull-requests: write # needed unless run with comment_mode: off
      actions: read # required by download step to access artifacts API

    steps:
       - name: Harden runner
         uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
         with:
           egress-policy: audit

       - name: Download and Extract Artifacts
         uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
         with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts

       - name: Publish Test Results
         uses: EnricoMi/publish-unit-test-result-action@b3f8796819acf652cecbf27a64fa9ac8d7e137ee # v2
         with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.xml"
