version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  # PHP (Composer) dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
  # JS dependencies
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "daily"
  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
